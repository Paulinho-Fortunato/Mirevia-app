name: Mirevia - APK instalavel com TMDB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirevia-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validar configuracao TMDB
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$TMDB_READ_TOKEN" || "$TMDB_READ_TOKEN" =~ [[:space:]] ]]; then
            echo "::error::Configura o secret TMDB_READ_TOKEN com o API Read Access Token, sem Bearer, espacos ou quebras de linha."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restaurar chave debug persistente (opcional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo "::warning::Sem chave persistente, outra execucao pode gerar uma assinatura diferente. Usa ANDROID_DEBUG_KEYSTORE_BASE64 para actualizar sem desinstalar."
          fi

      - name: Verificar fontes, testes e lint sem credenciais
        env:
          TMDB_READ_TOKEN: ''
          TMDB_PROXY_BASE_URL: ''
        shell: bash
        run: |
          chmod +x gradlew
          python3 scripts/verify_source.py
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug --no-daemon --no-build-cache --no-configuration-cache

      - name: Gerar APK com TMDB embutida e verificar assinatura
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_PROXY_BASE_URL: ''
        shell: bash
        run: |
          ./gradlew :app:assembleDebug --no-daemon --no-build-cache --no-configuration-cache

          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 24 "$APK"

          APK_INFO="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          if ! grep -qx "sdkVersion:'24'" <<< "$APK_INFO"; then
            echo "::error::O APK deve declarar minSdk 24 para permitir instalacao no Android 7.0."
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" artifacts/Mirevia.apk

          echo "### APK pessoal de teste" >> "$GITHUB_STEP_SUMMARY"
          echo "Descarrega o artefacto Mirevia-APK abaixo, extrai o ZIP e instala Mirevia.apk num Android 7.0 (API 24) ou superior." >> "$GITHUB_STEP_SUMMARY"
          echo "O APK inclui o token TMDB: quem obtiver o ficheiro pode extrai-lo. Nao e uma release para distribuicao publica." >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar APK instalavel
        uses: actions/upload-artifact@v4
        with:
          name: Mirevia-APK-${{ github.run_number }}
          path: artifacts/Mirevia.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Guardar relatorios de validacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mirevia-relatorios-${{ github.run_number }}
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Limpar ficheiros temporarios de compilacao e assinatura
        if: always()
        shell: bash
        run: |
          rm -rf app/build core/build .gradle artifacts
          rm -f "$HOME/.android/debug.keystore"
